# FORMA CI quality gate (FOR-84).
#
# First pipeline: builds and tests the backend and frontend on every pull
# request and on pushes to main. Backend and frontend run as independent jobs,
# so either one failing fails the pipeline. Commands mirror what developers run
# locally (see docs/local-development.md). Backend lint/format runs via Spotless
# inside `./gradlew build`; frontend lint/format run as explicit steps (FOR-85).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref to keep small PRs fast.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test
        run: ./gradlew build --no-daemon

  postgres-migrations:
    name: Postgres migration verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # No migration in this repository has ever been verified against a real PostgreSQL server
    # before deploy. The `backend` job above tests against H2 in PostgreSQL-compatibility mode
    # (application-test.yml, FOR-83) so `./gradlew build` needs no Docker — but that compatibility
    # mode is not Postgres: it has already forced real design decisions here (e.g. ADR-011's
    # nullable-sentinel + UNIQUE trick, used by V49/food_serving and V53/nutrition_plan among
    # others, in place of a partial index, because H2's `CREATE INDEX ... WHERE` does not parse).
    # Anything Postgres-specific that H2 silently accepts, or silently rejects, has been invisible
    # to CI until this job.
    #
    # A separate job rather than adding a service to `backend` above: this job runs in parallel
    # with `backend`/`frontend`/`nginx`, so it costs the pipeline's wall-clock nothing beyond what
    # it would already spend waiting on the ~4-minute frontend job — while the existing `backend`
    # job (the fast, Docker-free gate every PR hits first) stays byte-for-byte as it was. The
    # trade-off is a second JDK setup + Gradle classpath compile (a small amount of extra runner
    # time), which is worth paying to keep the fast path fast.
    #
    # Only Flyway's migration baseline runs here, NOT the full test suite a second time: re-running
    # every unit/integration test against Postgres would roughly double backend CI time for little
    # marginal signal, since the overwhelming majority of those tests exercise business logic that
    # never touches SQL dialect differences — the actual unverified risk is schema DDL, not
    # application code. The trade-off: this proves the 62+ migrations' SQL is valid on real
    # Postgres, but it does NOT prove the repository/adapter layer's queries (SELECT/INSERT/UPDATE)
    # behave identically on Postgres vs H2. That residual gap is real and left for future work
    # (e.g. tagging specific repository integration tests `postgres` incrementally, the same way
    # RealPostgresMigrationTest opts in below) rather than solved here.
    services:
      # Pinned to major version 17 to match compose.yaml's production image (postgres:17-alpine)
      # exactly — Postgres migration/SQL support can differ across major versions, so "real
      # Postgres, any version" would not actually prove anything about the version this deploys to.
      # Credentials and db name mirror compose.yaml's own local defaults (and application.yml's
      # fallback datasource URL), so this job invents no new configuration.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: forma
          POSTGRES_USER: forma
          POSTGRES_PASSWORD: forma_local_password
        ports:
          - 5432:5432
        # GitHub Actions blocks every step in this job until the service reports healthy, so
        # Flyway can never race an unready server — the same problem compose.yaml's own
        # `depends_on: condition: service_healthy` exists to prevent.
        options: >-
          --health-cmd "pg_isready -U forma -d forma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Runs only RealPostgresMigrationTest (tagged `postgres`; excluded from the plain `test`
      # task so `./gradlew build` never needs Postgres — see build.gradle). It boots the full
      # Spring context with NO profile active, so application.yml's base datasource applies
      # (the same SPRING_DATASOURCE_* variables compose.yaml and application-prod.yml use) instead
      # of application-test.yml's H2. Flyway runs automatically on context startup
      # (spring.flyway.enabled: true): if any migration fails to apply, context startup throws and
      # this step fails with Flyway's own error naming the exact migration and SQL error — that
      # failure mode alone proves the job ran. The test's own assertions go further and print, in
      # this step's log, how many of the migrations found on disk were applied and the version/
      # description of the last one — so a passing run is also observable, not just "no exception".
      - name: Verify all migrations apply cleanly to real PostgreSQL 17
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/forma
          SPRING_DATASOURCE_USERNAME: forma
          SPRING_DATASOURCE_PASSWORD: forma_local_password
        run: ./gradlew postgresTest --no-daemon

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # Layout checks (FOR-186). jsdom performs no layout, so the suite above
      # cannot see an overflow, a second scrollbar or a fill that never became
      # translucent — each of which has shipped as a visual bug. One browser is
      # enough: these assert geometry and computed style, not engine
      # differences. The API is stubbed, so no backend service is needed here.
      #
      # Run through an npm script, not `npx`: `npx` falls back to fetching a
      # package from the registry when it cannot resolve one locally, and runs
      # its lifecycle scripts, so the version that executes in CI is not the one
      # the lockfile pins. An npm script resolves `node_modules/.bin/playwright`
      # from the `npm ci` above and nothing else.
      - name: Install Playwright browser
        run: npm run test:layout:install

      - name: Layout checks
        run: npm run test:layout

      - name: Build
        run: npm run build

  nginx:
    name: Nginx proxy headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guards the double-reverse-proxy bug found in a real deployment of Google
      # login: frontend/nginx.conf must PRESERVE an incoming X-Forwarded-Proto/
      # -Host from a public proxy in front of it, not overwrite them with its
      # own view of the request (docs/adr/ADR-014-google-login.md). Runs the
      # real nginx.conf in Docker against a throwaway outer proxy + echo
      # backend — see frontend/nginx/test/ for the full topology and why this
      # needs Docker (ubuntu-latest has it; not every dev machine does).
      - name: Double-proxy forwarded-header coverage
        run: frontend/nginx/test/forwarded-headers.test.sh
