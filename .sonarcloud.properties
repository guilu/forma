# SonarCloud automatic-analysis configuration (FORMA).
#
# SonarCloud's automatic analysis reads THIS file (.sonarcloud.properties), not
# sonar-project.properties, which is only used by CI-based analysis.
#
# Why we exclude Flyway migrations from analysis:
# FORMA's database is PostgreSQL (ADR-003); tests run on H2 in PostgreSQL
# compatibility mode. SonarCloud ships SQL analyzers for Oracle PL/SQL and
# Microsoft T-SQL only — it has no PostgreSQL dialect. Running those rules over
# PostgreSQL DDL yields dialect false positives, e.g. "Use VARCHAR2 instead of
# VARCHAR" (VARCHAR2 is an Oracle-only type that PostgreSQL does not support and
# that would break the migration if applied).
#
# Flyway migrations are validated by the real PostgreSQL/H2 engine at application
# startup and by integration tests (see JdbcBodyMeasurementRepositoryTest,
# MigrationBaselineTest), so excluding them from SonarCloud loses no real signal.
#
# Why we exclude docs/ from analysis:
# docs/*.html are vendor-generated design mockups (docs/0-landing.html,
# docs/1-dashboard.html .. docs/4-nutricion.html). They are a *reference to
# translate* into the real React/CSS-Modules app, never built, served or
# imported by anything. Sonar analyses them as production web pages and raises
# accessibility defects that are real in the mockup and precisely what the
# translation fixes -- e.g. docs/0-landing.html's unlabelled login inputs
# (Web:InputWithoutLabelCheck) versus frontend/src/pages/LandingPage.tsx, which
# renders the same form through the labelled TextField primitive. Grading the
# app's reliability on the mockup's defects inverts the signal: the closer the
# mockup is to what the designer handed over, the worse the project scores.
#
# The rest of docs/ is Markdown, images and a spreadsheet -- no shipped code is
# hidden by this exclusion.
sonar.exclusions=backend/src/main/resources/db/migration/**,docs/**
