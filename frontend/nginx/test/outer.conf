# Simulates the PUBLIC TLS-terminating proxy that sits in front of FORMA's
# frontend container in production — the "outer" nginx in
# forwarded-headers.test.sh's topology comment. Real edge proxies terminate TLS
# and set fresh X-Forwarded-Proto/-Host from what THEY know about the original
# client request; that is reproduced here with a plain-http listener (no real
# TLS needed for this test — only the header values matter) that always
# declares https, since that is what the real edge proxy does in production.
#
# The upstream Host is deliberately hardcoded to something OTHER than the
# public hostname the client used, to reproduce the actual reported bug: the
# inner nginx (frontend/nginx.conf) used to derive X-Forwarded-Proto/-Host from
# its OWN view of the request ($scheme, $host) instead of trusting what this
# outer proxy already determined — so a test that reused the same Host end to
# end would not have caught it.
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://inner:8080;
        proxy_http_version 1.1;
        # Deliberately NOT the public hostname/port the client connected on —
        # this is the outer proxy's own internal upstream address, unrelated to
        # what the browser typed. If the inner nginx ever falls back to reading
        # this instead of X-Forwarded-Host, the test fails loudly.
        proxy_set_header Host 127.0.0.1:8080;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
