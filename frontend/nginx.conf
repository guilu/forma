# Serves the FORMA SPA and reverse-proxies the API (FOR-82). The unprivileged
# nginx image listens on 8080.

# Login with Google / double-reverse-proxy topology (bug found in a real
# deployment: public TLS proxy (OUTER) -> this container's nginx (INNER) ->
# backend). The OUTER proxy already sets X-Forwarded-Proto/-Host correctly
# before reaching this file; the two `proxy_set_header` lines below used to
# blindly OVERWRITE them with $scheme (this container's own plain-http view of
# itself — always "http", never "https") and $host (the Host header value,
# which nginx normalizes WITHOUT a port even when the OUTER proxy's Host
# carried one). Backend {baseUrl} reconstruction
# (server.forward-headers-strategy=framework, ADR-014 point 7) ended up wrong
# twice over: `http://` instead of `https://` in prod, and `127.0.0.1` with no
# `:3002` when reached through a published port (FOR-145d).
#
# Fix: prefer the incoming header when the OUTER proxy already set it; fall
# back to this container's own view ($scheme / $http_host — unlike $host,
# $http_host keeps an explicit port) only when nothing arrived, which is
# exactly the case when THIS nginx is itself the edge (plain `docker compose
# up` with no outer proxy, direct access on :3000/:3002).
#
# Trust boundary: this container now trusts whatever X-Forwarded-Proto/-Host
# reaches it, same as the backend already does (ADR-014's trust-boundary
# note) — acceptable because the outer proxy is the only thing allowed to
# reach this container in prod. When this container IS the edge (no outer
# proxy), nothing forwards these headers in, so a client-supplied one would
# only reach here if this container were itself publicly reachable without a
# proxy in front — not a supported deployment. Even then the blast radius is
# small: Google validates redirect_uri against the registered list (ADR-014
# point 7) and every redirect this app issues afterwards is a same-origin
# relative path (ADR-014 point 8), never an attacker-supplied absolute one.
map $http_x_forwarded_proto $forma_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $forma_forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API requests go to the backend container. From the browser's perspective
    # this is same-origin, so no absolute backend host is baked into the SPA
    # bundle and no CORS is needed. `backend` resolves via the compose network;
    # the full `/api/...` path is preserved (no trailing slash on proxy_pass).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forma_forwarded_proto;
        # Login with Google (ADR-012 addendum; double-proxy topology comment above).
        # server.forward-headers-strategy=framework (application.yml) reads this to
        # reconstruct the public host for the OAuth redirect-uri's {baseUrl}
        # placeholder, instead of the backend container's own plain-http view of
        # itself. Deliberately NOT setting X-Forwarded-Port here: nginx already
        # forwards any incoming header it does not itself override, so an outer
        # X-Forwarded-Port reaches the backend unchanged with no action needed here
        # — verified against Spring's ForwardedHeaderFilter semantics
        # (GoogleOAuth2ConfiguredIntegrationTest): X-Forwarded-Port only overrides
        # the port when present, and a port matching the scheme's default (443 for
        # https, 80 for http) is suppressed from the built URI either way, so it
        # never leaks in as a spurious `:443`.
        proxy_set_header X-Forwarded-Host $forma_forwarded_host;
    }

    # El cebado del token CSRF (ADR-012). `api/client.ts` pide esto antes de su
    # primer método no seguro para que Spring le siembre la cookie XSRF-TOKEN, y
    # `SecurityConfig` permite este GET sin autenticar exactamente para eso.
    #
    # Sin esta regla la petición caía en el `location /` de abajo y recibía el
    # index.html: 200, `content-type: text/html` y ninguna cookie. El cliente da
    # la respuesta por buena porque es un 200, no encuentra el token y aborta con
    # «No se pudo obtener el token CSRF» sin llegar a hacer la petición.
    #
    # No se notaba porque `AuthContext` pide `/api/v1/auth/me` en cada carga y esa
    # respuesta —aunque sea 401— también siembra la cookie. O sea que el cebado
    # llevaba muerto desde siempre y lo tapaba otra petición que casualmente va
    # antes. Basta con que esa falle para que el embudo público deje de calcular.
    #
    # Coincidencia EXACTA y no el prefijo `/actuator/`: el backend solo expone
    # `health` (`application.yml`, `show-details: never`), y esto lo deja escrito
    # donde se lee, de modo que exponer otro endpoint tenga que ser deliberado.
    location = /actuator/health {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Same double-proxy fix as /api/ above (see the topology comment at the top
        # of this file) — health checks don't build URLs from this, but keeping it
        # consistent avoids a surprising difference between the two locations.
        proxy_set_header X-Forwarded-Proto $forma_forwarded_proto;
    }

    # Client-side routing: serve index.html for unknown paths so React Router
    # can resolve them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
