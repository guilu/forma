# Serves the FORMA SPA and reverse-proxies the API (FOR-82). The unprivileged
# nginx image listens on 8080.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API requests go to the backend container. From the browser's perspective
    # this is same-origin, so no absolute backend host is baked into the SPA
    # bundle and no CORS is needed. `backend` resolves via the compose network;
    # the full `/api/...` path is preserved (no trailing slash on proxy_pass).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El cebado del token CSRF (ADR-012). `api/client.ts` pide esto antes de su
    # primer método no seguro para que Spring le siembre la cookie XSRF-TOKEN, y
    # `SecurityConfig` permite este GET sin autenticar exactamente para eso.
    #
    # Sin esta regla la petición caía en el `location /` de abajo y recibía el
    # index.html: 200, `content-type: text/html` y ninguna cookie. El cliente da
    # la respuesta por buena porque es un 200, no encuentra el token y aborta con
    # «No se pudo obtener el token CSRF» sin llegar a hacer la petición.
    #
    # No se notaba porque `AuthContext` pide `/api/v1/auth/me` en cada carga y esa
    # respuesta —aunque sea 401— también siembra la cookie. O sea que el cebado
    # llevaba muerto desde siempre y lo tapaba otra petición que casualmente va
    # antes. Basta con que esa falle para que el embudo público deje de calcular.
    #
    # Coincidencia EXACTA y no el prefijo `/actuator/`: el backend solo expone
    # `health` (`application.yml`, `show-details: never`), y esto lo deja escrito
    # donde se lee, de modo que exponer otro endpoint tenga que ser deliberado.
    location = /actuator/health {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: serve index.html for unknown paths so React Router
    # can resolve them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
