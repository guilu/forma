<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    a { color: #63e662; } a:hover { color: #8bef8a; }
  </style>
</helmet>
<div style="width: 366px; height: 461px; box-sizing: border-box; padding: 24px; background: #10141a; display: flex; align-items: flex-start; justify-content: flex-start">
  <div style="width: 318px; height: 413px; box-sizing: border-box; padding: 24px; background: #1c2026; border: 1px solid #30363d; border-radius: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4); display: flex; flex-direction: column; gap: 16px">

    <h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #8b949e">Tendencia 30 días</h2>

    <div style="display: flex; flex-direction: column; gap: 12px; flex-grow: 1">

      <svg width="268" height="282" viewBox="0 0 268 282" fill="none" style="display: block">
        <!-- Rejilla: líneas continuas de un tono por encima de la superficie. -->
        <line x1="32" y1="12" x2="196" y2="12" stroke="#262a31" stroke-width="1"></line>
        <line x1="32" y1="114" x2="196" y2="114" stroke="#262a31" stroke-width="1"></line>
        <line x1="32" y1="182" x2="196" y2="182" stroke="#262a31" stroke-width="1"></line>
        <line x1="32" y1="250" x2="196" y2="250" stroke="#262a31" stroke-width="1"></line>
        <!-- El cero no es una línea más: es el punto de partida contra el que se mide todo. -->
        <line x1="32" y1="46" x2="196" y2="46" stroke="#454c55" stroke-width="1"></line>

        <text x="26" y="16" text-anchor="end" font-size="10" fill="#8b949e">+2 %</text>
        <text x="26" y="50" text-anchor="end" font-size="10" fill="#8b949e" font-weight="600">0</text>
        <text x="26" y="118" text-anchor="end" font-size="10" fill="#8b949e">−4 %</text>
        <text x="26" y="186" text-anchor="end" font-size="10" fill="#8b949e">−8 %</text>
        <text x="26" y="254" text-anchor="end" font-size="10" fill="#8b949e">−12 %</text>

        <path d="{{ pesoLine }}" stroke="#63e662" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
        <path d="{{ grasaLine }}" stroke="#ffab70" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
        <path d="{{ musculoLine }}" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>

        <circle cx="{{ pesoEndX }}" cy="{{ pesoEndY }}" r="3.5" fill="#63e662" stroke="#1c2026" stroke-width="2"></circle>
        <circle cx="{{ grasaEndX }}" cy="{{ grasaEndY }}" r="3.5" fill="#ffab70" stroke="#1c2026" stroke-width="2"></circle>
        <circle cx="{{ musculoEndX }}" cy="{{ musculoEndY }}" r="3.5" fill="#3b82f6" stroke="#1c2026" stroke-width="2"></circle>

        <!-- Cada línea dice su nombre en su extremo: verde y ámbar son el mismo
             color para quien no distingue rojo y verde, así que el color no
             puede ser lo único que las separe. -->
        <text x="204" y="{{ musculoLabelY }}" font-size="11" fill="#bbcabe">Músculo</text>
        <text x="204" y="{{ pesoLabelY }}" font-size="11" fill="#bbcabe">Peso</text>
        <text x="204" y="{{ grasaLabelY }}" font-size="11" fill="#bbcabe">Grasa</text>

        <text x="32" y="276" font-size="12" fill="#8b949e">28 jul</text>
        <text x="196" y="276" text-anchor="end" font-size="12" fill="#8b949e">27 ago</text>
      </svg>

      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: nowrap; justify-content: space-between; gap: 8px; font-size: 11px; color: #8b949e; margin-top: auto">
        <li style="display: flex; align-items: center; gap: 4px; white-space: nowrap">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #63e662; flex-shrink: 0"></span>Peso <span style="color: #dfe2eb; font-weight: 600; font-variant-numeric: tabular-nums">−2,1 %</span>
        </li>
        <li style="display: flex; align-items: center; gap: 4px; white-space: nowrap">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #ffab70; flex-shrink: 0"></span>Grasa <span style="color: #dfe2eb; font-weight: 600; font-variant-numeric: tabular-nums">−10,7 %</span>
        </li>
        <li style="display: flex; align-items: center; gap: 4px; white-space: nowrap">
          <span style="width: 8px; height: 8px; border-radius: 50%; background: #3b82f6; flex-shrink: 0"></span>Músculo <span style="color: #dfe2eb; font-weight: 600; font-variant-numeric: tabular-nums">+1,3 %</span>
        </li>
      </ul>

    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview": {"width": 366, "height": 461}}'>
class Component extends DCLogic {
  renderVals() {
    const peso = [75.6, 75.4, 75.5, 75.1, 74.9, 75.0, 74.7, 74.6, 74.8, 74.4, 74.3, 74.4, 74.1, 74.2, 73.9, 74.0];
    const grasa = [16.8, 16.7, 16.5, 16.5, 16.2, 16.1, 16.0, 15.8, 15.9, 15.6, 15.5, 15.3, 15.4, 15.1, 15.1, 15.0];
    const musculo = [62.1, 62.2, 62.1, 62.3, 62.4, 62.3, 62.5, 62.6, 62.5, 62.7, 62.6, 62.8, 62.7, 62.9, 62.8, 62.9];

    const p = plot(peso);
    const g = plot(grasa);
    const m = plot(musculo);

    return {
      pesoLine: p.line, pesoEndX: p.endX, pesoEndY: p.endY, pesoLabelY: p.labelY,
      grasaLine: g.line, grasaEndX: g.endX, grasaEndY: g.endY, grasaLabelY: g.labelY,
      musculoLine: m.line, musculoEndX: m.endX, musculoEndY: m.endY, musculoLabelY: m.labelY,
    };
  }
}

const X0 = 32;
const X1 = 196;
/* Un solo eje, en tanto por ciento sobre el primer valor de la ventana: es lo
   que hace comparables tres magnitudes que no comparten unidad. */
const TOP = 2;
const BOTTOM = -12;
const Y_TOP = 12;
const Y_BOTTOM = 250;

function y(pct) {
  return Y_TOP + ((TOP - pct) / (TOP - BOTTOM)) * (Y_BOTTOM - Y_TOP);
}

function plot(values) {
  const base = values[0];
  const pts = values.map((v, i) => [
    X0 + (i / (values.length - 1)) * (X1 - X0),
    y(((v - base) / base) * 100),
  ]);
  const last = pts[pts.length - 1];
  return {
    line: monotone(pts),
    endX: Number(last[0].toFixed(2)),
    endY: Number(last[1].toFixed(2)),
    labelY: Number((last[1] + 4).toFixed(2)),
  };
}

/** Cúbica monótona (Fritsch-Carlson) — la misma curva que dibuja `type="monotone"` de Recharts. */
function monotone(pts) {
  const n = pts.length;
  if (n < 2) return '';
  const xs = pts.map((p) => p[0]);
  const ys = pts.map((p) => p[1]);
  const dxs = [];
  const ms = [];
  for (let i = 0; i < n - 1; i++) {
    dxs[i] = xs[i + 1] - xs[i];
    ms[i] = (ys[i + 1] - ys[i]) / dxs[i];
  }
  const c = [ms[0]];
  for (let i = 1; i < n - 1; i++) {
    if (ms[i - 1] * ms[i] <= 0) {
      c[i] = 0;
    } else {
      const w1 = 2 * dxs[i] + dxs[i - 1];
      const w2 = dxs[i] + 2 * dxs[i - 1];
      c[i] = (w1 + w2) / (w1 / ms[i - 1] + w2 / ms[i]);
    }
  }
  c[n - 1] = ms[n - 2];
  let d = 'M' + xs[0].toFixed(2) + ' ' + ys[0].toFixed(2);
  for (let i = 0; i < n - 1; i++) {
    const t = dxs[i] / 3;
    d += ' C' + (xs[i] + t).toFixed(2) + ' ' + (ys[i] + c[i] * t).toFixed(2) +
         ' ' + (xs[i + 1] - t).toFixed(2) + ' ' + (ys[i + 1] - c[i + 1] * t).toFixed(2) +
         ' ' + xs[i + 1].toFixed(2) + ' ' + ys[i + 1].toFixed(2);
  }
  return d;
}
</script>
</body>
</html>
