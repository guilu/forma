<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
    a { color: #63e662; } a:hover { color: #8bef8a; }
  </style>
</helmet>
<div style="width: 366px; height: 461px; box-sizing: border-box; padding: 24px; background: #10141a; display: flex; align-items: flex-start; justify-content: flex-start">
  <div style="width: 318px; height: 413px; box-sizing: border-box; padding: 24px; background: #1c2026; border: 1px solid #30363d; border-radius: 12px; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4); display: flex; flex-direction: column; gap: 16px">

    <h2 style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #8b949e">Tendencia 30 días</h2>

    <div style="display: flex; flex-direction: column; gap: 12px">

      <svg width="268" height="140" viewBox="0 0 268 140" fill="none" style="display: block">
        <path d="{{ pesoPath }}" stroke="#63e662" stroke-width="2" stroke-linecap="round" fill="none"></path>
        <path d="{{ grasaPath }}" stroke="#ffab70" stroke-width="2" stroke-linecap="round" fill="none"></path>
        <path d="{{ musculoPath }}" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" fill="none"></path>
      </svg>

      <div style="display: flex; justify-content: space-between; gap: 12px">
        <span style="font-size: 13px; color: #8b949e">28 jul</span>
        <span style="font-size: 13px; color: #8b949e">27 ago</span>
      </div>

      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: nowrap; gap: 12px; font-size: 13px; color: #8b949e">
        <li style="display: flex; align-items: center; gap: 4px; white-space: nowrap">
          <span style="width: 0.75em; height: 0.75em; border-radius: 50%; background: #63e662; flex-shrink: 0"></span>Peso (kg)
        </li>
        <li style="display: flex; align-items: center; gap: 4px; white-space: nowrap">
          <span style="width: 0.75em; height: 0.75em; border-radius: 50%; background: #ffab70; flex-shrink: 0"></span>Grasa (%)
        </li>
        <li style="display: flex; align-items: center; gap: 4px; white-space: nowrap">
          <span style="width: 0.75em; height: 0.75em; border-radius: 50%; background: #3b82f6; flex-shrink: 0"></span>Músculo (kg)
        </li>
      </ul>

    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview": {"width": 366, "height": 461}}'>
class Component extends DCLogic {
  renderVals() {
    const peso = [75.6, 75.4, 75.5, 75.1, 74.9, 75.0, 74.7, 74.6, 74.8, 74.4, 74.3, 74.4, 74.1, 74.2, 73.9, 74.0];
    const grasa = [16.8, 16.7, 16.5, 16.5, 16.2, 16.1, 16.0, 15.8, 15.9, 15.6, 15.5, 15.3, 15.4, 15.1, 15.1, 15.0];
    const musculo = [62.1, 62.2, 62.1, 62.3, 62.4, 62.3, 62.5, 62.6, 62.5, 62.7, 62.6, 62.8, 62.7, 62.9, 62.8, 62.9];

    // Exactamente lo que hace hoy MultiLineChart.normalize(): cada serie se
    // reescala contra SU PROPIO mínimo y máximo sobre la misma caja. Por eso
    // 1,7 kg de peso y 1,8 puntos de grasa acaban dibujando la misma montaña.
    return {
      pesoPath: this.path(peso),
      grasaPath: this.path(grasa),
      musculoPath: this.path(musculo),
    };
  }

  path(values) {
    const w = 268;
    const h = 140;
    const pad = 6;
    const min = Math.min(...values);
    const max = Math.max(...values);
    const range = max - min || 1;
    const inner = h - pad * 2;
    const pts = values.map((v, i) => [
      pad + (i / (values.length - 1)) * (w - pad * 2),
      pad + inner - ((v - min) / range) * inner,
    ]);
    return monotone(pts);
  }
}

/** Cúbica monótona (Fritsch-Carlson) — la misma curva que dibuja `type="monotone"` de Recharts. */
function monotone(pts) {
  const n = pts.length;
  if (n < 2) return '';
  const xs = pts.map((p) => p[0]);
  const ys = pts.map((p) => p[1]);
  const dxs = [];
  const ms = [];
  for (let i = 0; i < n - 1; i++) {
    dxs[i] = xs[i + 1] - xs[i];
    ms[i] = (ys[i + 1] - ys[i]) / dxs[i];
  }
  const c = [ms[0]];
  for (let i = 1; i < n - 1; i++) {
    if (ms[i - 1] * ms[i] <= 0) {
      c[i] = 0;
    } else {
      const w1 = 2 * dxs[i] + dxs[i - 1];
      const w2 = dxs[i] + 2 * dxs[i - 1];
      c[i] = (w1 + w2) / (w1 / ms[i - 1] + w2 / ms[i]);
    }
  }
  c[n - 1] = ms[n - 2];
  let d = 'M' + xs[0].toFixed(2) + ' ' + ys[0].toFixed(2);
  for (let i = 0; i < n - 1; i++) {
    const t = dxs[i] / 3;
    d += ' C' + (xs[i] + t).toFixed(2) + ' ' + (ys[i] + c[i] * t).toFixed(2) +
         ' ' + (xs[i + 1] - t).toFixed(2) + ' ' + (ys[i + 1] - c[i + 1] * t).toFixed(2) +
         ' ' + xs[i + 1].toFixed(2) + ' ' + ys[i + 1].toFixed(2);
  }
  return d;
}
</script>
</body>
</html>
