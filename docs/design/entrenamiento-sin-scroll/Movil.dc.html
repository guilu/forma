<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #16801f; text-decoration: none; }
    a:hover { color: #0f5e16; }

    .app {
      --bg: #f4f7f5;
      --surface: #ffffff;
      --card: #ffffff;
      --border: #dfe7e2;
      --text: #0f1a13;
      --muted: #5c6b62;
      --secondary: #3c4a42;
      --accent: #63e662;
      --accent-strong: #16801f;
      --warning: #f19c2b;
      --violet: #8b5cf6;
      --violet-strong: #6d28d9;
      --info: #53adf3;
      --ramp: linear-gradient(135deg, #0b755f 0%, #85f55c 100%);
      --on-ramp: #10141a;
      --shadow: 0 1px 3px rgba(15, 26, 19, 0.08);
      --body-tint: none;

      width: 1440px;
      height: 900px;
      overflow: hidden;
      display: grid;
      grid-template-rows: 80px 1fr;
      background: var(--bg);
      color: var(--text);
      font-family: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 16px;
    }

    .app[data-theme="dark"] {
      --bg: #10141a;
      --surface: #161b22;
      --card: #1c2026;
      --border: #30363d;
      --text: #dfe2eb;
      --muted: #8b949e;
      --secondary: #bbcabe;
      --accent-strong: #63e662;
      --warning: #ffab70;
      --violet-strong: #a78bfa;
      --info: #3b82f6;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      --body-tint: invert(1) brightness(1.6) contrast(0.85);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--ramp);
      display: grid; place-items: center;
      color: var(--on-ramp);
      font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 19px;
    }
    .brand-word {
      font-family: 'Montserrat', sans-serif; font-weight: 800;
      font-size: 21px; letter-spacing: 0.04em; color: var(--text);
    }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--card);
      display: grid; place-items: center; color: var(--muted);
    }
    .account {
      display: flex; align-items: center; gap: 10px;
      height: 40px; padding: 0 16px 0 12px;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--card); color: var(--text); font-size: 15px;
    }

    .shell { display: grid; grid-template-columns: 272px 1fr; min-height: 0; }

    .sidebar {
      display: flex; flex-direction: column; gap: 24px;
      padding: 16px;
      background: var(--surface);
      border-right: 1px solid var(--border);
    }
    .nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-radius: 12px;
      color: var(--muted); font-size: 16px; font-weight: 500;
    }
    .nav-item[data-active="true"] {
      background: color-mix(in srgb, var(--accent) 10%, transparent);
      color: var(--accent-strong); font-weight: 700;
      border-right: 4px solid var(--accent);
    }
    .integration {
      display: flex; align-items: center; gap: 12px;
      padding: 12px; border: 1px solid var(--border); border-radius: 12px;
    }
    .integration-name {
      font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700;
      letter-spacing: 0.06em; color: var(--text);
    }
    .integration-status { font-size: 13px; color: var(--muted); }

    .content { padding: 32px; min-width: 0; display: flex; flex-direction: column; gap: 16px; }

    .page-head { display: flex; align-items: center; justify-content: space-between; }
    .page-title {
      margin: 0; font-family: 'Montserrat', sans-serif;
      font-size: 24px; font-weight: 700; line-height: 1.2; color: var(--text);
    }
    .page-sub { margin: 4px 0 0; font-size: 16px; color: var(--muted); }
    .date-nav {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px;
    }
    .date-label { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 16px;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .card-title {
      margin: 0 0 12px;
      font-size: 13px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--muted);
    }
    .today-card { border-left: 2px solid var(--accent); }
    .today-card .card-title { color: var(--accent-strong); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 40px; padding: 0 18px;
      font-family: inherit; font-size: 15px; font-weight: 700;
      border: 1px solid transparent; border-radius: 8px;
    }
    .btn-secondary { color: var(--text); background: transparent; border-color: var(--border); }
    .btn-primary {
      color: var(--on-ramp); background: var(--ramp);
      box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 30%, transparent);
    }

    /*
     * The silhouettes never size their own box: they are handed one and fitted
     * inside it. They used to carry `height: 100%`, a percentage resolved
     * against the whole card rather than against the room its siblings leave,
     * so a body grew past the card and painted over whatever sat next to it.
     * `object-fit: contain` inside a flex item that is allowed to shrink
     * (`min-height: 0`) cannot overflow, and the art keeps its ratio either way.
     */
    .body-row {
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      object-fit: contain;
      display: block;
      filter: var(--body-tint);
    }
    .body-col {
      flex: 1 1 0;
      width: 100%;
      min-height: 0;
      object-fit: contain;
      display: block;
      filter: var(--body-tint);
    }

    .ring { display: grid; place-items: center; border-radius: 50%; }
    .ring > .ring-hole {
      display: grid; place-items: center; border-radius: 50%;
      background: var(--surface);
    }

    .stat-tile {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; box-shadow: var(--shadow);
      padding: 14px 16px; display: flex; flex-direction: column; gap: 2px;
      min-width: 0;
    }
    .stat-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase; color: var(--muted);
    }
    .stat-value {
      margin: 2px 0 0; font-family: 'Montserrat', sans-serif;
      font-size: 24px; font-weight: 700; line-height: 1.1; color: var(--text);
    }
    .stat-unit { font-family: 'Be Vietnam Pro', sans-serif; font-size: 15px; font-weight: 500; color: var(--muted); }
    .stat-caption { font-size: 12px; color: var(--muted); }

    .day {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 8px 6px; border: 1px solid var(--border); border-radius: 8px;
      min-width: 0;
    }
    .day-name {
      font-size: 11px; font-weight: 700; letter-spacing: 0.02em;
      text-transform: uppercase; color: var(--muted);
    }
    .day-title { font-size: 12px; font-weight: 600; line-height: 1.25; text-align: center; }
    .day-today { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
    .dot { width: 7px; height: 7px; border-radius: 50%; }

    /* ── Móvil 390×844: sin barra lateral, con la píldora flotante de la app ── */
    .app { width: 390px; height: 844px; }
    .topbar { padding: 0 20px; }
    .shell { grid-template-columns: 1fr; position: relative; }
    /*
     * El hueco de abajo es para la píldora flotante: sin él la fila de KPIs
     * quedaba debajo de la barra, medio tapada. Y la columna sí desplaza — en
     * móvil no se persigue el "sin scroll", solo que el orden sea el correcto.
     */
    .content { padding: 16px 20px 92px; gap: 14px; overflow-y: auto; }
    .page-head { align-items: center; }
    .mobile-nav {
      position: absolute; left: 20px; right: 20px; bottom: 16px; height: 62px;
      display: flex; align-items: center; justify-content: space-around;
      border: 1px solid var(--border); border-radius: 9999px;
      background: color-mix(in srgb, var(--bg) 80%, transparent);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(15, 26, 19, 0.10);
    }
    .mobile-item {
      width: 44px; height: 44px; display: grid; place-items: center;
      border-radius: 9999px; color: var(--muted);
    }
    .mobile-item[data-active="true"] {
      color: var(--accent-strong);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
    }
    .day-today { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
  </style>
</helmet>

<div class="app" data-theme="{{theme}}">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">F</span>
      <span class="brand-word">FORMA</span>
    </div>
    <div class="topbar-right">
      <span class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></span>
      <span class="icon-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM5 20a7 7 0 0 1 14 0"></path></svg></span>
    </div>
  </header>

  <div class="shell">
    <main class="content">

      <div class="page-head">
        <h1 class="page-title" style="font-size: 21px">Entrenamiento</h1>
        <div class="date-nav" style="padding: 6px 10px">
          <span class="date-label" style="font-size: 12px">Mié, 19 ago</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color: #5c6b62; transform: rotate(180deg)"><path d="M9 6l6 6-6 6"></path></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color: #5c6b62"><path d="M9 6l6 6-6 6"></path></svg>
        </div>
      </div>

      <!--
        En móvil "sin scroll" deja de ser el objetivo: 390×844 no da para la
        semana entera y forzarlo solo produce tipografía ilegible. Lo que se
        mantiene de la C es el orden — hoy completo y accionable arriba, la
        semana justo debajo — y la fila de días pasa a deslizarse en horizontal,
        que es lo que el calendario de la app ya hace hoy por debajo de 1100px.
      -->
      <section class="card today-card" style="padding: 16px">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
          <p class="card-title" style="margin: 0; font-size: 12px">Hoy · Mié 19</p>
          <span style="display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 9999px; font-size: 11px; font-weight: 700; color: var(--accent-strong); background: color-mix(in srgb, var(--accent) 14%, transparent)">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5 11-11"></path></svg>
            Completado
          </span>
        </div>

        <p style="margin: 8px 0 0; font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.15">Fuerza · Tirón</p>
        <p style="margin: 4px 0 0; font-size: 14px; color: var(--secondary)">5 ejercicios</p>

        <div style="display: flex; align-items: stretch; justify-content: center; gap: 16px; height: 132px; margin: 10px 0 12px">
          <img class="body-row" src="body-front.png" alt="">
          <img class="body-row" src="body-back.png" alt="">
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px">
          <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; color: var(--violet-strong); background: color-mix(in srgb, var(--violet) 13%, transparent)">Espalda</span>
          <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; color: var(--violet-strong); background: color-mix(in srgb, var(--violet) 13%, transparent)">Bíceps</span>
          <span style="display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; color: var(--violet-strong); background: color-mix(in srgb, var(--violet) 13%, transparent)">Hombro posterior</span>
        </div>

        <!-- 44px de alto: el mínimo de la guía para un objetivo táctil. -->
        <div style="display: flex; gap: 8px">
          <span class="btn btn-secondary" style="flex: 0 0 auto; height: 44px">Detalle</span>
          <span class="btn btn-primary" style="flex: 1; height: 44px">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"></path></svg>
            Entrenar
          </span>
        </div>
      </section>

      <div>
        <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px">
          <p class="card-title" style="margin: 0">La semana</p>
          <span style="font-size: 12px; color: var(--muted)">1 / 6 hechas</span>
        </div>
        <div style="display: flex; gap: 8px; overflow: hidden">
          <div class="card" style="flex: 0 0 84px; padding: 8px 6px; align-items: center; gap: 5px; height: 128px; opacity: 0.85">
            <span class="day-name">Lun</span>
            <span class="dot" style="background: var(--accent)"></span>
            <img class="body-col" src="body-front.png" alt="">
            <span class="day-title" style="font-size: 11px">Rodaje</span>
          </div>
          <div class="card" style="flex: 0 0 84px; padding: 8px 6px; align-items: center; gap: 5px; height: 128px; opacity: 0.85">
            <span class="day-name">Mar</span>
            <span class="dot" style="background: var(--warning)"></span>
            <img class="body-col" src="body-back.png" alt="">
            <span class="day-title" style="font-size: 11px">Empuje</span>
          </div>
          <div class="card day-today" style="flex: 0 0 84px; padding: 8px 6px; align-items: center; gap: 5px; height: 128px">
            <span class="day-name" style="color: var(--accent-strong)">Mié</span>
            <span class="dot" style="background: var(--info)"></span>
            <img class="body-col" src="body-back.png" alt="">
            <span class="day-title" style="font-size: 11px">Tirón</span>
          </div>
          <div class="card" style="flex: 0 0 84px; padding: 8px 6px; align-items: center; gap: 5px; height: 128px">
            <span class="day-name">Jue</span>
            <span class="dot" style="background: var(--border)"></span>
            <img class="body-col" src="body-front.png" alt="">
            <span class="day-title" style="font-size: 11px">Series</span>
          </div>
          <div class="card" style="flex: 0 0 84px; padding: 8px 6px; align-items: center; gap: 5px; height: 128px">
            <span class="day-name">Vie</span>
            <span class="dot" style="background: var(--border)"></span>
            <img class="body-col" src="body-back.png" alt="">
            <span class="day-title" style="font-size: 11px">Pierna</span>
          </div>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div class="stat-tile" style="padding: 10px 12px">
          <span class="stat-label" style="font-size: 10px">Carreras</span>
          <p class="stat-value" style="font-size: 19px">0 / 3</p>
        </div>
        <div class="stat-tile" style="padding: 10px 12px">
          <span class="stat-label" style="font-size: 10px">Fuerza</span>
          <p class="stat-value" style="font-size: 19px">1 / 3</p>
        </div>
        <div class="stat-tile" style="padding: 10px 12px">
          <span class="stat-label" style="font-size: 10px">Racha</span>
          <p class="stat-value" style="font-size: 19px">2 <span class="stat-unit" style="font-size: 12px">días</span></p>
        </div>
      </div>

    </main>

    <nav class="mobile-nav">
      <span class="mobile-item"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h7v7H3zM14 3h7v4h-7zM14 10h7v11h-7zM3 13h7v8H3z"></path></svg></span>
      <span class="mobile-item"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 7 4-14 3 7h4"></path></svg></span>
      <span class="mobile-item" data-active="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6v12M18 6v12M4 9h2v6H4zM18 9h2v6h-2zM6 12h12"></path></svg></span>
      <span class="mobile-item"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c4 0 6 3 6 7a6 6 0 0 1-12 0c0-4 2-7 6-7zM12 3v6"></path></svg></span>
      <span class="mobile-item"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></span>
    </nav>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light","section":"Tema"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'light' };
  }
}
</script>
</body>
</html>
